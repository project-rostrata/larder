# Builds and pushes the standalone all-in-one image (docker/Dockerfile's `standalone` stage: app,
# ingredient-parser sidecar and Postgres in one container, see docs/deployment.md) to GHCR on
# every push to main and on version tags. Same shape as shelf's workflow of the same name, and
# hand-rolled with plain docker commands for the same reason: no third-party build/push actions
# (docker/build-push-action, docker/metadata-action, ...) for commands this simple.
#
# The tests run by building the Dockerfile's test-only stages, so they use exactly the pinned
# images and toolchain the shipped image does, and every version lives in docker/Dockerfile
# alone -- nothing here to keep in step. actions/checkout (GitHub's own) is the only action used.
name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  # Gate the image build: a broken build or a failing test means nothing gets pushed.
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the backend (Java 25, pinned kotlinc)
        run: docker build --target backend-test -f docker/Dockerfile .

  test-ingredient-parser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Test the sidecar in the runtime image
        run: docker build --target parser-test -f docker/Dockerfile .

  build-and-push:
    needs: [test-backend, test-ingredient-parser]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the standalone image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # GHCR image names must be lowercase; github.repository keeps the owner's casing.
          IMAGE="${IMAGE,,}"
          TAGS=("$IMAGE:sha-${GITHUB_SHA::7}")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS+=("$IMAGE:${GITHUB_REF_NAME}")
          else
            TAGS+=("$IMAGE:latest")
          fi

          TAG_ARGS=()
          for t in "${TAGS[@]}"; do TAG_ARGS+=(-t "$t"); done

          docker build --target standalone -f docker/Dockerfile "${TAG_ARGS[@]}" .

          for t in "${TAGS[@]}"; do docker push "$t"; done
